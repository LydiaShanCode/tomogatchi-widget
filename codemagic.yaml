workflows:
  ios-validation:
    name: iOS simulator validation
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      node: 22
    scripts:
      - name: Check project and optional assets
        script: |
          python3 scripts/generate_project.py
          python3 scripts/validate_assets.py
      - name: Resolve packages
        script: xcodebuild -resolvePackageDependencies -project FeedConnor.xcodeproj -scheme FeedConnor
      - name: Build app and widget and run state tests
        script: |
          set -euo pipefail
          mkdir -p build
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")))')
          xcodebuild test -project FeedConnor.xcodeproj -scheme FeedConnor -destination "platform=iOS Simulator,id=$DEVICE_ID,arch=arm64" -resultBundlePath build/StateTests.xcresult ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ios-validation.log
      - name: Backend tests
        script: cd backend/functions && npm ci && npm test
    artifacts:
      - build/StateTests.xcresult
      - build/ios-validation.log
      - /tmp/xcodebuild_logs/*.log
  screenshots:
    name: Native app screenshots (sample data)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Verify assets and prepare project
        script: |
          set -eu
          python3 scripts/validate_assets.py --require-assets
          python3 scripts/generate_project.py
      - name: Capture native Simulator screenshots
        script: |
          set -euo pipefail
          mkdir -p build
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")))')
          xcodebuild test -project FeedConnor.xcodeproj -scheme FeedConnor -configuration Debug -only-testing:FeedConnorUITests -destination "platform=iOS Simulator,id=$DEVICE_ID,arch=arm64" -parallel-testing-enabled NO -resultBundlePath build/Screenshots.xcresult ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/screenshots-build.log
      - name: Export screenshot attachments
        script: |
          set -eu
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments --path build/Screenshots.xcresult --output-path build/screenshots
          python3 - <<'PY'
          from pathlib import Path
          images=list(Path('build/screenshots').rglob('*.png'))
          assert len(images)>=14, f'Expected 14 captures including eight widget previews, found {len(images)}'
          print('\n'.join(str(p) for p in images))
          PY
          cd build && zip -r FEED-CONNOR-native-screenshots.zip screenshots
    artifacts:
      - build/screenshots/**
      - build/FEED-CONNOR-native-screenshots.zip
      - build/Screenshots.xcresult
      - build/screenshots-build.log
